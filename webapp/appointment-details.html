<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Appointment Details / Bill - Sunrise Dental Clinic</title>
<link rel="stylesheet" href="css/style.css">
<style>
  @media print {
    .no-print { display: none !important; }
    .page { margin: 0; }
    .card { border: none; }
  }
</style>
</head>
<body>

<div class="topbar no-print">
  <div class="brand">
    <img src="img/logo.png" alt="logo">
    <div class="brand-text">
      <div class="title">Sunrise Dental Clinic</div>
      <div class="subtitle"><a href="dashboard.html" style="color:#dce6f5;">&larr; Back to Main Menu</a></div>
    </div>
  </div>
  <div id="topbar-who" class="who"></div>
</div>

<div class="page">
  <div class="card no-print">
    <h2 class="mt-0"><img src="img/icon_search.png" alt=""> Find an Appointment</h2>
    <form id="search-form" class="field-row">
      <div>
        <label for="apptNo">Appointment Number</label>
        <input type="text" id="apptNo" placeholder="e.g. APT2026-0001" required>
      </div>
      <div style="flex:none;">
        <label>&nbsp;</label>
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>
    <div id="search-status" class="status error"></div>
  </div>

  <div class="two-col" id="results" style="display:none;">
    <div class="card no-print">
      <h2 class="mt-0">Appointment Details</h2>
      <dl class="detail-grid">
        <dt>Patient Name</dt><dd id="d-patientName">-</dd>
        <dt>Address</dt><dd id="d-address">-</dd>
        <dt>Contact Number</dt><dd id="d-contact">-</dd>
        <dt>Dentist</dt><dd id="d-dentist">-</dd>
        <dt>Treatment</dt><dd id="d-treatment">-</dd>
        <dt>Date / Time</dt><dd id="d-datetime">-</dd>
        <dt>Status</dt><dd id="d-status">-</dd>
      </dl>
    </div>

    <div class="card">
      <h2 class="mt-0 no-print"><img src="img/icon_bill.png" alt=""> Billing</h2>

      <div class="no-print" id="billing-controls">
        <div class="checkbox-row">
          <input type="checkbox" id="discount-check">
          <label for="discount-check">Apply returning-patient discount (10% off treatment, from 4th visit)</label>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="generate-btn" disabled>Generate Bill</button>
          <button class="btn btn-secondary" id="print-btn" disabled>Print Bill</button>
        </div>
        <div id="bill-status" class="status error"></div>
      </div>

      <div class="receipt" id="receipt" style="margin-top:12px;">No bill generated yet.</div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const session = Session.requireLogin();
  if (session) renderUserBar();

  let currentAppointment = null;

  document.getElementById("search-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const apptNo = document.getElementById("apptNo").value.trim().toUpperCase();
    if (!apptNo) { showStatus("search-status", "Appointment number is required.", "error"); return; }

    document.getElementById("results").style.display = "none";
    showStatus("search-status", "Searching...", "info");

    try {
      const appointment = await apiFetch("GET", "/api/appointments/" + encodeURIComponent(apptNo));
      currentAppointment = appointment;

      document.getElementById("d-patientName").textContent = appointment.patientName || "-";
      document.getElementById("d-address").textContent = appointment.patientAddress || "-";
      document.getElementById("d-contact").textContent = appointment.patientContact || "-";
      document.getElementById("d-dentist").textContent = appointment.dentistName || "-";
      document.getElementById("d-treatment").textContent = appointment.treatmentName || "-";
      document.getElementById("d-datetime").textContent = appointment.appointmentDate + "  " + appointment.appointmentTime;
      document.getElementById("d-status").textContent = appointment.status;

      document.getElementById("results").style.display = "grid";
      showStatus("search-status", "", "");

      // check for an existing bill
      try {
        const bill = await apiFetch("GET", "/api/bills/" + encodeURIComponent(appointment.appointmentNumber));
        renderReceipt(bill);
        setBillingEnabled(false);
        document.getElementById("print-btn").disabled = false;
      } catch (billErr) {
        document.getElementById("receipt").textContent = "No bill has been generated for this appointment yet.";
        setBillingEnabled(true);
        document.getElementById("print-btn").disabled = true;
      }
    } catch (err) {
      showStatus("search-status", err.message, "error");
    }
  });

  function setBillingEnabled(enabled) {
    document.getElementById("discount-check").disabled = !enabled;
    document.getElementById("generate-btn").disabled = !enabled;
  }

  document.getElementById("generate-btn").addEventListener("click", async () => {
    if (!currentAppointment) return;
    const applyDiscount = document.getElementById("discount-check").checked;
    showStatus("bill-status", "Calculating bill...", "info");
    try {
      const bill = await apiFetch("POST", "/api/bills", {
        appointmentNumber: currentAppointment.appointmentNumber,
        applyDiscount: applyDiscount
      });
      if (!bill.patientName) bill.patientName = currentAppointment.patientName;
      if (!bill.dentistName) bill.dentistName = currentAppointment.dentistName;
      if (!bill.treatmentName) bill.treatmentName = currentAppointment.treatmentName;
      renderReceipt(bill);
      document.getElementById("d-status").textContent = "COMPLETED";
      setBillingEnabled(false);
      document.getElementById("print-btn").disabled = false;
      showStatus("bill-status", "", "");
    } catch (err) {
      showStatus("bill-status", err.message, "error");
    }
  });

  document.getElementById("print-btn").addEventListener("click", () => window.print());

  function renderReceipt(bill) {
    const rs = (n) => "Rs. " + Number(n).toFixed(2);
    const lines = [
      "        SUNRISE DENTAL CLINIC",
      "     Appointment & Billing Receipt",
      "----------------------------------------",
      "Bill No.        : " + bill.billNumber,
      "Appointment No. : " + bill.appointmentNumber,
      "Patient         : " + (bill.patientName || "-"),
      "Dentist         : " + (bill.dentistName || "-"),
      "Treatment       : " + (bill.treatmentName || "-"),
      "----------------------------------------",
      pad("Consultation Fee", rs(bill.consultationFee)),
      pad("Treatment Cost", rs(bill.treatmentCost)),
      pad("Discount", rs(bill.discount)),
      "----------------------------------------",
      pad("TOTAL DUE", rs(bill.totalAmount)),
      "----------------------------------------",
      "Thank you for visiting Sunrise Dental Clinic."
    ];
    document.getElementById("receipt").textContent = lines.join("\n");
  }

  function pad(label, value) {
    const width = 22;
    return label + " ".repeat(Math.max(1, width - label.length)) + value;
  }
</script>
</body>
</html>
