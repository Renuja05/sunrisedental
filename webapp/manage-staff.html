<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manage Staff Accounts - Sunrise Dental Clinic</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="img/logo.png" alt="logo">
    <div class="brand-text">
      <div class="title">Sunrise Dental Clinic</div>
      <div class="subtitle"><a href="dashboard.html" style="color:#dce6f5;">&larr; Back to Main Menu</a></div>
    </div>
  </div>
  <div id="topbar-who" class="who"></div>
</div>

<div class="page">
  <div class="card">
    <h2 class="mt-0"><img src="img/icon_staff.png" alt=""> Staff Accounts</h2>
    <div id="list-status" class="status"></div>
    <table id="staff-table">
      <thead><tr><th>User ID</th><th>Username</th><th>Full Name</th><th>Role</th><th>Active</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="btn-row">
      <button class="btn btn-secondary" id="refresh-btn">Refresh</button>
    </div>
  </div>

  <div class="card">
    <h2 class="mt-0">Add Staff Account</h2>
    <form id="add-form">
      <div class="two-col">
        <div>
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" required>
          <label for="username">Username</label>
          <input type="text" id="username" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" required>
          <label>Role</label>
          <div class="checkbox-row">
            <input type="radio" name="role" id="role-receptionist" value="RECEPTIONIST" checked>
            <label for="role-receptionist" style="display:inline;">Receptionist</label>
            &nbsp;&nbsp;
            <input type="radio" name="role" id="role-admin" value="ADMINISTRATOR">
            <label for="role-admin" style="display:inline;">Administrator</label>
          </div>
        </div>
      </div>
      <div id="add-status" class="status error"></div>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary">Create Account</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const session = Session.requireLogin();
  if (session) {
    renderUserBar();
    if (session.user.role !== "ADMINISTRATOR") {
      alert("Only an Administrator can access Manage Staff Accounts.");
      window.location.href = "dashboard.html";
    }
  }

  async function loadStaff() {
    showStatus("list-status", "Loading...", "info");
    try {
      const result = await apiFetch("GET", "/api/staff");
      const tbody = document.querySelector("#staff-table tbody");
      tbody.innerHTML = "";
      result.staff.forEach((u) => {
        const tr = document.createElement("tr");

        const cells = [u.userId, u.username, u.fullName, u.role, u.active ? "Yes" : "No"];
        cells.forEach((c) => {
          const td = document.createElement("td");
          td.textContent = c;
          tr.appendChild(td);
        });

        const actionsTd = document.createElement("td");
        const toggleBtn = document.createElement("button");
        toggleBtn.className = "btn btn-secondary";
        toggleBtn.style.padding = "4px 10px";
        toggleBtn.style.fontSize = "12px";
        toggleBtn.textContent = u.active ? "Deactivate" : "Activate";
        toggleBtn.addEventListener("click", () => toggleActive(u));
        actionsTd.appendChild(toggleBtn);

        actionsTd.appendChild(document.createTextNode(" "));

        const resetBtn = document.createElement("button");
        resetBtn.className = "btn btn-secondary";
        resetBtn.style.padding = "4px 10px";
        resetBtn.style.fontSize = "12px";
        resetBtn.textContent = "Reset Password";
        resetBtn.addEventListener("click", () => resetPassword(u));
        actionsTd.appendChild(resetBtn);

        tr.appendChild(actionsTd);
        tbody.appendChild(tr);
      });
      showStatus("list-status", result.staff.length + " account(s).", "info");
    } catch (err) {
      showStatus("list-status", err.message, "error");
    }
  }

  async function toggleActive(user) {
    const newActive = !user.active;
    if (!confirm((newActive ? "Activate" : "Deactivate") + " " + user.username + "?")) return;
    try {
      await apiFetch("PUT", "/api/staff/" + user.userId + "/active", { active: newActive });
      loadStaff();
    } catch (err) {
      alert("Could not update the account: " + err.message);
    }
  }

  async function resetPassword(user) {
    const newPassword = prompt("New password for " + user.username + " (minimum 6 characters):");
    if (newPassword === null) return;
    if (newPassword.length < 6) { alert("Password must be at least 6 characters long."); return; }
    try {
      await apiFetch("PUT", "/api/staff/" + user.userId + "/password", { password: newPassword });
      alert("Password reset for " + user.username + ".");
    } catch (err) {
      alert("Could not reset the password: " + err.message);
    }
  }

  document.getElementById("refresh-btn").addEventListener("click", loadStaff);

  document.getElementById("add-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fullName = document.getElementById("fullName").value.trim();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const role = document.querySelector('input[name="role"]:checked').value;

    if (!fullName || !username || !password) {
      showStatus("add-status", "All fields are required.", "error");
      return;
    }
    if (password.length < 6) {
      showStatus("add-status", "Password must be at least 6 characters long.", "error");
      return;
    }

    try {
      await apiFetch("POST", "/api/staff", { fullName, username, password, role });
      showStatus("add-status", "Account created for " + username + ".", "success");
      document.getElementById("add-form").reset();
      loadStaff();
    } catch (err) {
      showStatus("add-status", err.message, "error");
    }
  });

  loadStaff();
</script>
</body>
</html>
