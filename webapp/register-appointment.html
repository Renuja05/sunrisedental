<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register New Appointment - Sunrise Dental Clinic</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="img/logo.png" alt="logo">
    <div class="brand-text">
      <div class="title">Sunrise Dental Clinic</div>
      <div class="subtitle"><a href="dashboard.html" style="color:#dce6f5;">&larr; Back to Main Menu</a></div>
    </div>
  </div>
  <div id="topbar-who" class="who"></div>
</div>

<div class="page">
  <div class="card">
    <h2><img src="img/icon_appointment.png" alt=""> Register New Appointment</h2>

    <form id="register-form">
      <div class="two-col">
        <div>
          <label for="patientName">Patient Name</label>
          <input type="text" id="patientName" required>

          <label for="address">Address</label>
          <input type="text" id="address" required>

          <label for="contactNumber">Contact Number</label>
          <input type="text" id="contactNumber" placeholder="07XXXXXXXX" required>
        </div>
        <div>
          <label for="dentist">Dentist</label>
          <select id="dentist" required><option value="">Loading...</option></select>

          <label for="treatment">Treatment Type</label>
          <select id="treatment" required><option value="">Loading...</option></select>

          <div class="field-row">
            <div>
              <label for="date">Appointment Date</label>
              <input type="date" id="date" required>
            </div>
            <div>
              <label for="time">Appointment Time</label>
              <select id="time" required></select>
            </div>
          </div>
        </div>
      </div>

      <div id="status" class="status error"></div>

      <div class="btn-row">
        <button type="submit" class="btn btn-primary" id="register-btn">Register Appointment</button>
        <a href="dashboard.html" class="btn btn-secondary">Close</a>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const session = Session.requireLogin();
  if (session) renderUserBar();

  // ---- populate the time slots: 08:00 - 16:45 every 15 minutes ----
  const timeSelect = document.getElementById("time");
  for (let h = 8; h <= 16; h++) {
    ["00", "15", "30", "45"].forEach((m) => {
      const value = String(h).padStart(2, "0") + ":" + m;
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = value;
      timeSelect.appendChild(opt);
    });
  }
  document.getElementById("date").min = new Date().toISOString().split("T")[0];

  // ---- load dentists and treatments ----
  async function loadReferenceData() {
    try {
      const [dentistsResp, treatmentsResp] = await Promise.all([
        apiFetch("GET", "/api/dentists"),
        apiFetch("GET", "/api/treatments")
      ]);
      const dentistSelect = document.getElementById("dentist");
      dentistSelect.innerHTML = '<option value="">-- Select a dentist --</option>';
      dentistsResp.dentists.forEach((d) => {
        const opt = document.createElement("option");
        opt.value = d.dentistId;
        opt.textContent = d.name + " (" + d.specialization + ")";
        dentistSelect.appendChild(opt);
      });

      const treatmentSelect = document.getElementById("treatment");
      treatmentSelect.innerHTML = '<option value="">-- Select a treatment --</option>';
      treatmentsResp.treatments.forEach((t) => {
        const opt = document.createElement("option");
        opt.value = t.treatmentId;
        opt.textContent = t.treatmentName + " (Rs. " + t.cost.toFixed(2) + ")";
        treatmentSelect.appendChild(opt);
      });
    } catch (err) {
      showStatus("status", "Could not load dentists/treatments: " + err.message, "error");
    }
  }
  loadReferenceData();

  // ---- basic client-side validation, mirroring util.Validator on the server ----
  const NAME_RE = /^[A-Za-z][A-Za-z.'\- ]{1,79}$/;
  const PHONE_RE = /^(0\d{9}|\+94\d{9})$/;

  function validate(fields) {
    if (!fields.patientName || !NAME_RE.test(fields.patientName)) {
      return "Patient name may only contain letters, spaces, apostrophes and hyphens (2-80 characters).";
    }
    if (!fields.address || fields.address.length < 5) {
      return "Address must be at least 5 characters.";
    }
    if (!fields.contactNumber || !PHONE_RE.test(fields.contactNumber)) {
      return "Contact number must be in the form 07XXXXXXXX or +947XXXXXXXX.";
    }
    if (!fields.dentistId) return "Dentist must be selected.";
    if (!fields.treatmentId) return "Treatment type must be selected.";
    if (!fields.date) return "Appointment date is required.";
    if (!fields.time) return "Appointment time is required.";
    return null;
  }

  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fields = {
      patientName: document.getElementById("patientName").value.trim(),
      address: document.getElementById("address").value.trim(),
      contactNumber: document.getElementById("contactNumber").value.trim(),
      dentistId: document.getElementById("dentist").value,
      treatmentId: document.getElementById("treatment").value,
      date: document.getElementById("date").value,
      time: document.getElementById("time").value
    };

    const validationError = validate(fields);
    if (validationError) {
      showStatus("status", validationError, "error");
      return;
    }

    const btn = document.getElementById("register-btn");
    btn.disabled = true;
    showStatus("status", "Checking availability and saving...", "info");
    try {
      const appointment = await apiFetch("POST", "/api/appointments", fields);
      showStatus("status",
          "Appointment registered! Number: " + appointment.appointmentNumber +
          " -- please give this to the patient.", "success");
      document.getElementById("register-form").reset();
    } catch (err) {
      showStatus("status", err.message, "error");
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
